[general]
reaper_freq = 5
desiredgov = performance
igpu_desiredgov = performance
defaultgov = powersave
softrealtime = auto
renice = -5
ioprio = 0
inhibit_screensaver = 1

[filter]
whitelist =
blacklist = kwin_wayland plasmashell

[cpu]
park_cores = no
pin_cores = no

[scheduler]
policy = SCHED_BATCH
priority = 0

[gpu]
apply_gpu_optimisations = accept-responsibility
gpu_device = 0
amd_performance_level = high

[supervisor]
supervisor_whitelist =
supervisor_blacklist =
require_supervisor = 0

[custom]
# Run BalOS boost mode when game starts
start=/usr/bin/balboost
# Return to previous profile after game exits
end=/usr/bin/balsaver --balanced
