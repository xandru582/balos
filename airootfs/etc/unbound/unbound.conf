# BalOS local DNS resolver — validates DNSSEC, caches, minimizes leakage
# Runs on :5335 upstream; dnscrypt-proxy listens on :53

server:
    verbosity: 0
    interface: 127.0.0.1@5335
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    do-daemonize: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    cache-min-ttl: 3600
    cache-max-ttl: 86400
    prefetch: yes
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    rrset-cache-size: 256m
    msg-cache-size: 128m
    so-rcvbuf: 1m
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
    unwanted-reply-threshold: 10000
    val-log-level: 1
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    minimal-responses: yes
    root-hints: "/etc/unbound/root.hints"
    auto-trust-anchor-file: "/etc/unbound/root.key"
