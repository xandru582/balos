# BalOS default USBGuard ruleset
#
# Policy: allow common classes but block HID devices that also expose
# storage/network (classic Rubber Ducky / Bash Bunny pattern).
#
# Use `usbguard generate-policy` to capture your existing trusted devices
# and append them here after first boot.

# Allow HID (keyboard/mouse) with interface class 03 ONLY
allow with-interface equals { 03:*:* } if !allowed-matches(with-interface one-of { 08:*:* 0a:*:* e0:*:* 02:*:* })

# Allow mass storage (USB sticks) as long as they're not also HID
allow with-interface equals { 08:06:50 }

# Allow hubs
allow with-interface equals { 09:00:00 }

# Allow audio, video (webcams)
allow with-interface equals { 01:*:* }
allow with-interface equals { 0e:*:* }

# Allow printers
allow with-interface equals { 07:*:* }

# Block devices that combine HID + anything else (Rubber Ducky pattern)
reject with-interface all-of { 03:*:* 08:*:* }
reject with-interface all-of { 03:*:* 02:*:* }
reject with-interface all-of { 03:*:* 0a:*:* }

# Default action (applied for unmatched)
# (ImplicitPolicyTarget=block in daemon config handles this)
