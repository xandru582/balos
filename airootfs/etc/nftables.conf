#!/usr/bin/nft -f
# BalOS default firewall (normal level)
# Stricter presets: /etc/balos/nftables-armor.nft, /etc/balos/nftables-fortress.nft

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state { established, related } accept
        ct state invalid drop

        # ICMP (echo, unreach, time-exceeded)
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type {
            echo-request,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            nd-router-advert,
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem
        } accept

        # SSH (non-standard port, rate-limited)
        tcp dport 2222 ct state new limit rate 5/minute accept

        # DHCPv6 client
        udp dport 546 accept

        # mDNS / Avahi (local discovery)
        ip daddr 224.0.0.251 udp dport 5353 accept

        # Syncthing (uncomment if used)
        # tcp dport 22000 accept
        # udp dport 22000 accept

        # Log & drop
        limit rate 5/minute log prefix "[BalOS fw] "
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
