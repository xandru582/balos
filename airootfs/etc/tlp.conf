# ═══════════════════════════════════════════════════════════════
# BalOS TLP — aggressive battery saving on BAT
# Complements auto-cpufreq (TLP handles everything EXCEPT freq scaling)
# ═══════════════════════════════════════════════════════════════

TLP_ENABLE=1
TLP_WARN_LEVEL=3
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# ── CPU ──────────────────────────────────────────────────────────
# On BAT: powersave with aggressive energy policy
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1

# Cap CPU to 60% on battery — saves big
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=60
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100

# ── GPU ──────────────────────────────────────────────────────────
RADEON_DPM_PERF_LEVEL_ON_AC=high
RADEON_DPM_PERF_LEVEL_ON_BAT=low
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# Intel GPU
INTEL_GPU_MIN_FREQ_ON_AC=0
INTEL_GPU_MIN_FREQ_ON_BAT=0
INTEL_GPU_MAX_FREQ_ON_BAT=400
INTEL_GPU_BOOST_FREQ_ON_BAT=400

# ── Platform ─────────────────────────────────────────────────────
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# ── Disk ─────────────────────────────────────────────────────────
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
DISK_APM_LEVEL_ON_AC=254
DISK_APM_LEVEL_ON_BAT=128
DISK_SPINDOWN_TIMEOUT_ON_AC=0
DISK_SPINDOWN_TIMEOUT_ON_BAT=0
SATA_LINKPWR_ON_AC=max_performance
SATA_LINKPWR_ON_BAT=min_power

NVME_POWER_PM_ON_AC=active
NVME_POWER_PM_ON_BAT=auto

# ── PCIe ─────────────────────────────────────────────────────────
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# ── Runtime PM ───────────────────────────────────────────────────
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ── USB ──────────────────────────────────────────────────────────
USB_AUTOSUSPEND=1
USB_AUTOSUSPEND_DELAY_S=2
# Gaming / hacking peripherals — keep active:
# Logitech, Razer, SteelSeries, Corsair, Xbox, PS, 8BitDo, Alfa (Realtek WiFi)
USB_DENYLIST="046d:* 1532:* 1038:* 1b1c:* 045e:* 054c:* 2dc8:* 0bda:* 148f:*"
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0

# ── WiFi (power-save when idle) ──────────────────────────────────
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ── Audio ────────────────────────────────────────────────────────
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ── Battery care (ThinkPad/etc — uncomment if supported) ─────────
# START_CHARGE_THRESH_BAT0=20
# STOP_CHARGE_THRESH_BAT0=80
# START_CHARGE_THRESH_BAT1=20
# STOP_CHARGE_THRESH_BAT1=80

# ── Kernel watchdog ──────────────────────────────────────────────
NMI_WATCHDOG=0

RESTORE_DEVICE_STATE_ON_STARTUP=0
