# BalOS · Kitty terminal — hacker green on matrix black
font_family           JetBrainsMono Nerd Font
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             11.0
disable_ligatures     never

# ── Window ─────────────────────────────────────────────────────
window_padding_width     8
window_margin_width      0
hide_window_decorations  no
background_opacity       0.92
dynamic_background_opacity yes
confirm_os_window_close  0

# ── Cursor ─────────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ── Scrollback ─────────────────────────────────────────────────
scrollback_lines              50000
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INPUT-LINE-NUMBER
scrollback_pager_history_size 10
wheel_scroll_multiplier       5.0

# ── Mouse ──────────────────────────────────────────────────────
mouse_hide_wait           3.0
url_color                 #00ff88
url_style                 curly
copy_on_select            yes
strip_trailing_spaces     smart

# ── Tabs ───────────────────────────────────────────────────────
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    " {index}: {title} "
active_tab_font_style bold

# ── Colors (BalOS Matrix theme) ────────────────────────────────
foreground              #b8ffce
background              #020604
selection_foreground    #020604
selection_background    #00ff88

active_tab_foreground   #020604
active_tab_background   #00ff88
inactive_tab_foreground #b8ffce
inactive_tab_background #0a1810

url_color               #b580ff
cursor                  #00ff88
cursor_text_color       #020604

# Basic 16 colors
color0  #081008
color8  #3a7040
color1  #ff3366
color9  #ff6080
color2  #00ff88
color10 #55ffaa
color3  #ffcc33
color11 #ffdd66
color4  #5599ff
color12 #88bbff
color5  #b580ff
color13 #d0a8ff
color6  #00ddff
color14 #55eeff
color7  #b8ffce
color15 #e0ffe8

# ── Keybindings ────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+f launch --type=tab less @last_cmd_output

# ── Performance ────────────────────────────────────────────────
repaint_delay           8
input_delay             1
sync_to_monitor         yes

# ── Bell ───────────────────────────────────────────────────────
enable_audio_bell  no
visual_bell_duration 0.1
