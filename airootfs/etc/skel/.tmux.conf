# BalOS tmux — Matrix theme, hacker shortcuts

# ─── core ─────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g focus-events on
set -g status-interval 2

# ─── keybinds ─────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display '↻ reloaded'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode vi
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -i -selection clipboard"

# ─── quick launchers ──────────────────────────────────────────
bind-key M-m new-window -n monitor 'balmonitor'
bind-key M-n new-window -n net 'balnet watch'
bind-key M-h new-window -n hack 'balhack'
bind-key M-v new-window -n vault 'balvault'
bind-key M-s new-window -n stealth 'balstealth status'

# ─── Matrix theme ─────────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#020604 fg=#00ff88'
set -g status-left-length 50
set -g status-right-length 150

set -g status-left '#[fg=#020604,bg=#00ff88,bold] ❯ BalOS #[fg=#00ff88,bg=#020604] #S │ '
set -g status-right '#[fg=#00ff8899] #(cat /run/balos-mode 2>/dev/null || echo default) │ #[fg=#00ff88,bold]%H:%M #[fg=#00ff8899]%d-%b '

setw -g window-status-format '#[fg=#006040] #I:#W '
setw -g window-status-current-format '#[fg=#020604,bg=#00ff88,bold] #I:#W '

set -g pane-border-style 'fg=#003322'
set -g pane-active-border-style 'fg=#00ff88'

set -g message-style 'bg=#00ff88 fg=#020604 bold'
set -g mode-style 'bg=#00ff88 fg=#020604 bold'

# ─── clock ────────────────────────────────────────────────────
setw -g clock-mode-colour '#00ff88'
setw -g clock-mode-style 24
