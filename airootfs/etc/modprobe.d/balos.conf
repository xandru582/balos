# ═══════════════════════════════════════════════════════════════
# BalOS kernel module options
# Aggressive power savings + WiFi monitor-mode-ready + gaming perf
# ═══════════════════════════════════════════════════════════════

# ── Audio power save (snd_hda_intel) ────────────────────────────
options snd_hda_intel power_save=1 power_save_controller=Y

# ── WiFi: max flexibility for pentesting + power tuning ─────────
# Intel iwlwifi: disable 11n aggregation only if injecting (advanced)
options iwlwifi power_save=1 uapsd_disable=1 bt_coex_active=0 swcrypto=1
options iwlmvm power_scheme=3

# Realtek USB (Alfa AWUS036, common pentest dongle)
options rtl8xxxu TxAggMode=0

# Atheros ath9k_htc (classic injection-friendly)
options ath9k nohwcrypt=1 blink=1
options ath9k_htc nohwcrypt=1

# MediaTek mt76
options mt76 disable_usb_sg=1

# ── Graphics ────────────────────────────────────────────────────
# AMD: enable Display Core, ASPM, GPU recovery
options amdgpu dc=1 aspm=1 gpu_recovery=1 reset_method=4 sg_display=0 deep_color=1

# Intel: panel self refresh + framebuffer compression
options i915 enable_psr=2 enable_fbc=1 fastboot=1 enable_guc=3 disable_power_well=0

# NVIDIA Nouveau (open-source)
options nouveau modeset=1

# ── USB ─────────────────────────────────────────────────────────
# Reduce USB polling on mice/keyboards (1ms vs default 8ms)
options usbhid mousepoll=1 kbpoll=1 jspoll=1

# ── NVMe: maximum idle power save ───────────────────────────────
options nvme_core default_ps_max_latency_us=5500

# ── PCIe ASPM ───────────────────────────────────────────────────
# options pcie_aspm policy=powersupersave

# ── Bluetooth ───────────────────────────────────────────────────
options btusb enable_autosuspend=1

# ── Blacklist modules (security + performance) ──────────────────
# Uncomment if you don't need them:
# blacklist pcspkr
# blacklist snd_pcsp
# blacklist iTCO_wdt          # disable Intel watchdog
# blacklist cdc_ncm           # USB network (security)
# blacklist firewire-core     # DMA attack vector
# blacklist thunderbolt       # DMA attack vector (if you don't use TB)
