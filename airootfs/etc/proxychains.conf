# BalOS proxychains-ng config — default routes through Tor

# Strict_chain: chain ALL proxies in order (if one fails, chain fails)
# Dynamic_chain: skip failing proxies
# Random_chain: pick random subset

dynamic_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
localnet 127.0.0.0/255.0.0.0
localnet 10.0.0.0/255.0.0.0
localnet 172.16.0.0/255.240.0.0
localnet 192.168.0.0/255.255.0.0

[ProxyList]
# Tor SOCKS (always available when tor service running)
socks5 127.0.0.1 9050

# Add additional chains below:
# socks5 <proxy_ip> <port> [user] [pass]
# http   <proxy_ip> <port>
