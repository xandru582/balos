# ═══════════════════════════════════════════════════════════════
# BalOS kernel runtime tunables
# Balances: gaming latency · battery life · network security
# ═══════════════════════════════════════════════════════════════

# ── Memory ──────────────────────────────────────────────────────
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000

# Steam / Wine / many games need this (default 65530 is too low)
vm.max_map_count = 2147483642

# Allow overcommit for Electron apps / Wine
vm.overcommit_memory = 1

# ── Scheduler ───────────────────────────────────────────────────
kernel.sched_migration_cost_ns = 5000000
kernel.sched_autogroup_enabled = 1
kernel.sched_min_granularity_ns = 1000000
kernel.sched_wakeup_granularity_ns = 1500000
kernel.sched_latency_ns = 6000000

# ── File descriptors (Esync/Fsync for Proton) ────────────────────
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# ── Network: low-latency gaming + safety ────────────────────────
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.core.rmem_default = 1048576
net.core.rmem_max = 16777216
net.core.wmem_default = 1048576
net.core.wmem_max = 16777216

# TCP BBR congestion control (gaming / uploads)
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = cake

# TCP tuning
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# ── Network HARDENING (hacker-grade) ─────────────────────────────
# IP spoofing / martians
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# ICMP
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# SYN flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_synack_retries = 2

# IPv6
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.default.accept_ra = 0    # Don't auto-configure v6 routes
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.autoconf = 0
net.ipv6.conf.default.dad_transmits = 0
net.ipv6.conf.default.max_addresses = 1

# ── Kernel hardening ─────────────────────────────────────────────
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.printk = 3 3 3 3
kernel.unprivileged_bpf_disabled = 1
kernel.yama.ptrace_scope = 1           # Prevent process peeking
kernel.kexec_load_disabled = 1
kernel.sysrq = 4                       # Allow secure SysRq (safer than 1)

# ── Process accounting / core dumps ──────────────────────────────
kernel.core_uses_pid = 1
fs.suid_dumpable = 0
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ── Power ────────────────────────────────────────────────────────
kernel.nmi_watchdog = 0
