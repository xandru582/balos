# BalOS resource limits — allow Esync/Fsync and real-time audio/gaming

# High hard limits for file descriptors (Esync needs 500k+)
*               soft    nofile          524288
*               hard    nofile          1048576

# Real-time priority (PipeWire, GameMode)
@audio          -       rtprio          99
@audio          -       memlock         unlimited
@audio          -       nice            -19
@gamemode       -       rtprio          99
@gamemode       -       nice            -19

# Core dumps disabled by default (security)
*               hard    core            0

# No fork bombs
*               soft    nproc           32768
*               hard    nproc           65536
