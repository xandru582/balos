[main]
dhcp=internal
dns=none
rc-manager=unmanaged

[connection]
# Power save when idle (off = disabled, 2 = enable)
wifi.powersave=2
# MAC randomization on scan (privacy)
wifi.scan-rand-mac-address=yes
# Use stable random MAC per-SSID (prevents fingerprinting)
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable

[device]
wifi.scan-rand-mac-address=yes
wifi.backend=iwd

[connectivity]
enabled=false
# Disable NetworkManager connectivity probing (leaks your presence)

[logging]
level=WARN
domains=ALL
