[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
ILoveCandy
DisableDownloadTimeout

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR: prebuilt AUR packages (faster than AUR helpers)
[chaotic-aur]
SigLevel = Never
Include = /etc/pacman.d/chaotic-mirrorlist

# BlackArch: 2800+ pentesting tools
# SigLevel=Never because BlackArch rotates signing keys often; the ISO is
# integrity-checked as a whole (sha256 on release) so per-pkg sigs add little.
[blackarch]
SigLevel = Never
Include = /etc/pacman.d/blackarch-mirrorlist

# Chaotic-AUR key can also fail silently on unreliable keyservers;
# same rationale as blackarch — trust the mirror TLS + ISO-level checks.

# BalOS local repo (custom kernel + tools)
[balos]
SigLevel = Never
Server = file:///balos-repo
