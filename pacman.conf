[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
ILoveCandy
DisableDownloadTimeout
# Required for building under QEMU/Rosetta (arm64 host → amd64 container).
# pacman's seccomp 'alpm' sandbox fails under emulation — disable it so
# mkarchiso's pacstrap works. Harmless on native x86_64.
DisableSandbox

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# NOTE: Chaotic-AUR was previously enabled here but removed because its
# bleeding-edge variants (e.g. mesa-tkg-git) conflict with the stable base
# packages we depend on. The AUR packages we actually want (proton-ge,
# auto-cpufreq, ananicy-cpp, nohang, heroic, undervolt) are compiled
# directly by the Dockerfile and served from the local [balos] repo below.

# BlackArch: 2800+ pentesting tools
# SigLevel=Never because BlackArch rotates signing keys often; the ISO is
# integrity-checked as a whole (sha256 on release) so per-pkg sigs add little.
[blackarch]
SigLevel = Never
Include = /etc/pacman.d/blackarch-mirrorlist

# BalOS local repo (custom kernel + AUR-compiled tools)
[balos]
SigLevel = Never
Server = file:///balos-repo
