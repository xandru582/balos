SERIAL 0 115200
UI menu.c32
MENU TITLE BalOS — hack · play · evade · endure
MENU TABMSG Press [Tab] to edit · [Enter] to boot

MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ff00ff88 #00000000 std
MENU COLOR sel          7;37;40 #e0000000 #ff00ff88 all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std

DEFAULT balos
TIMEOUT 80
PROMPT 0

LABEL balos
    MENU LABEL BalOS Live
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash rw

LABEL balos-verbose
    MENU LABEL BalOS Live (verbose)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% debug rw

LABEL balos-safe
    MENU LABEL BalOS Live (nomodeset)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset rw

LABEL memtest
    MENU LABEL Memory test
    LINUX /boot/memtest86+/memtest

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Shutdown
    COM32 poweroff.c32
