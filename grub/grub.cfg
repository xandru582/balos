# BalOS GRUB boot menu

set timeout=8
set default=0

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="1920x1080x32;1600x900x32;1280x1024x32;1024x768x32;auto"
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

# Matrix green palette
set color_normal=light-green/black
set color_highlight=black/light-green
set menu_color_normal=light-green/black
set menu_color_highlight=black/light-green

menuentry "BalOS Live" --class balos --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash loglevel=3 rw
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "BalOS Live (verbose)" --class balos {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% debug rw
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "BalOS Live (nomodeset - safe graphics)" --class balos {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset rw
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Memory test (memtest86+)" --class memtest {
    linux /boot/memtest86+/memtest
}

menuentry "EFI Firmware Setup" --class efi {
    fwsetup
}

menuentry "Reboot" --class reboot { reboot }
menuentry "Shutdown" --class shutdown { halt }
