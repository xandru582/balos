# BalOS kernel sysctl defaults — /usr/lib/sysctl.d/99-balos-kernel.conf
#
# Runtime tunables that complement the compile-time hardening in
# balkernel.config. Users can override any of these from
# /etc/sysctl.d/10-local.conf — distro packages should never write to
# /etc/sysctl.d. Order matters: this file number (99) makes it one of
# the last applied, so downstream files win.
#
# Every setting has a one-line reason.

# ─── Kernel hardening ──────────────────────────────────────────────
kernel.dmesg_restrict=1                # only root reads dmesg
kernel.kptr_restrict=2                 # hide kernel pointers from unpriv
kernel.yama.ptrace_scope=1             # ptrace only children
kernel.unprivileged_bpf_disabled=1     # unpriv BPF off (compile-time too)
kernel.kexec_load_disabled=1           # defensive (kexec compiled out anyway)
kernel.perf_event_paranoid=3           # restrict perf to root
kernel.sysrq=4                         # only allow safe SysRq (unraw keyboard)
kernel.core_pattern=|/bin/false        # don't dump cores (can leak keys)
fs.suid_dumpable=0                     # no coredumps for setuid binaries
fs.protected_symlinks=1
fs.protected_hardlinks=1
fs.protected_fifos=2
fs.protected_regular=2

# ─── Network hardening ─────────────────────────────────────────────
net.ipv4.conf.all.rp_filter=1          # strict reverse path filter
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.default.secure_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_rfc1337=1                 # RFC 1337: drop RST in TIME_WAIT
net.ipv4.conf.all.log_martians=1
net.ipv6.conf.all.use_tempaddr=2       # IPv6 privacy extensions
net.ipv6.conf.default.use_tempaddr=2

# ─── Network performance ───────────────────────────────────────────
net.core.default_qdisc=cake            # matches CONFIG_DEFAULT_CAKE
net.ipv4.tcp_congestion_control=bbr
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 16384 16777216
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_fastopen=3

# ─── Memory management ─────────────────────────────────────────────
vm.swappiness=10                       # prefer RAM; ZRAM absorbs the rest
vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=5
vm.dirty_writeback_centisecs=1500
vm.mmap_rnd_bits=32                    # max ASLR entropy on x86_64
vm.mmap_rnd_compat_bits=16
vm.max_map_count=1048576               # Steam/Proton games need a lot
vm.oom_dump_tasks=0

# ─── Scheduling ────────────────────────────────────────────────────
kernel.sched_autogroup_enabled=1
kernel.sched_cfs_bandwidth_slice_us=3000
kernel.sched_migration_cost_ns=500000
kernel.sched_nr_migrate=256

# ─── File-handle + PID space (dev boxes) ───────────────────────────
fs.file-max=2097152
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024
kernel.pid_max=4194304
