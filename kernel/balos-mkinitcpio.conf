# BalOS recommended /etc/mkinitcpio.conf
# Shipped as /usr/share/balos/mkinitcpio.conf.example (the installer
# copies it to /etc/mkinitcpio.conf only if the user hasn't customised
# theirs). Produces small, fast, encrypted-boot-capable initramfs.

MODULES=()

BINARIES=()

FILES=()

# Ordering notes:
#   base       → essential
#   systemd    → use systemd init (modern, resumable, faster)
#   autodetect → only bake in modules the host actually uses
#   microcode  → apply AMD/Intel ucode early
#   modconf    → honour /etc/modprobe.d
#   kms        → graphics firmware in initramfs
#   keyboard   → USB + PS/2 keyboards for LUKS prompt
#   keymap     → allow non-US layouts during LUKS unlock
#   plymouth   → splash (optional; remove if not installed)
#   block      → block-device modules
#   sd-encrypt → systemd LUKS unlock (replaces encrypt hook)
#   filesystems→ fs drivers
#   fsck       → run fsck before mount
HOOKS=(base systemd autodetect microcode modconf kms keyboard keymap plymouth block sd-encrypt filesystems fsck)

# ZSTD — ~2x faster decompression vs xz, ~10 % larger image.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)

MODULES_DECOMPRESS="yes"
