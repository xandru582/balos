# BalOS kernel command line — canonical reference.
#
# Placed at /usr/lib/balos/kernel-cmdline.conf. The bootloader install
# script (balos-install) reads this and pipes the flags into the
# systemd-boot entry / grub entry at first install. After first boot,
# edit /etc/kernel/cmdline or your bootloader config — this file stays
# as the blessed default.
#
# Each flag has an inline reason; deleting one should be a deliberate,
# reviewed choice.

# ── Output ─────────────────────────────────────────────────────────
quiet                                  # no console spam during boot
loglevel=3                             # only errors to the console
rd.udev.log_priority=3                 # same for the initramfs

# ── Security mitigations (compile-time defaults already strict;
#    cmdline keeps them on even when a distro tool flips them) ──────
mitigations=auto                       # enable ALL per-arch CPU mits
pti=on                                 # KPTI (Meltdown)
spectre_v2=on                          # Spectre v2
spec_store_bypass_disable=on           # Spectre v4
l1tf=full,force                        # L1TF
mds=full,nosmt                         # MDS + disable SMT on affected cpus
tsx=off                                # disable TSX (one less attack vector)
tsx_async_abort=full,nosmt

# ── LSM stack (must match CONFIG_LSM) ──────────────────────────────
lsm=landlock,lockdown,yama,loadpin,integrity,apparmor,bpf
lockdown=integrity                     # mid-strength — keeps tooling working
apparmor=1
security=apparmor

# ── Memory / slab hardening ────────────────────────────────────────
init_on_alloc=1                        # zero fresh pages (cheap)
init_on_free=1                         # zero on free (small perf cost)
page_alloc.shuffle=1                   # randomize freelist order
slab_nomerge                           # no cross-slab merging
vsyscall=none                          # modern Arch doesn't need vsyscall
randomize_kstack_offset=on             # per-syscall stack ASLR

# ── I/O ────────────────────────────────────────────────────────────
nowatchdog                             # desktop boxes don't need hw wdt
nvme_core.default_ps_max_latency_us=0  # disable NVMe power-save (latency)

# ── Graphics (sensible on most laptops) ─────────────────────────────
#amdgpu.ppfeaturemask=0xffffffff        # OC unlocked (if you know what you're doing)
#i915.enable_fbc=1                      # framebuffer compression on Intel
#nouveau.modeset=1

# ── Power / sleep ──────────────────────────────────────────────────
#resume=UUID=XXXXX                     # set by balos-install

# ── Gaming / latency ───────────────────────────────────────────────
preempt=full                           # PREEMPT_DYNAMIC: always pre-emptible
threadirqs                             # threaded IRQs (lower jitter)

# ── Misc ───────────────────────────────────────────────────────────
rw                                     # mount root RW
splash                                 # plymouth if installed
module.sig_enforce=0                   # allow unsigned OOT modules (aircrack…)
