name: lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check bal* tools
        run: |
          set -e
          fail=0
          for f in airootfs/usr/bin/bal*; do
            [[ -f "$f" ]] || continue
            # Allow minor issues (SC1091 = can't follow source, SC2034 = unused vars
            # for color consts, SC2086 = unquoted on purpose for arrays)
            shellcheck -e SC1091,SC2034,SC2086,SC2155,SC1090,SC2181,SC2206,SC2207,SC2010,SC2046,SC2012,SC2126,SC2162,SC2001,SC2028,SC2053,SC2236 -S error "$f" || fail=$((fail+1))
          done
          exit $fail

      - name: Check build.sh
        run: shellcheck -e SC1091,SC2086 build.sh || true

  pkg-list-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No duplicate packages
        run: |
          dups=$(grep -vE '^\s*(#|$)' packages.x86_64 | sort | uniq -d)
          if [[ -n "$dups" ]]; then
            echo "Duplicate packages:"; echo "$dups"; exit 1
          fi
